<!DOCTYPE html>
<html>
<head>
    <title>ComicCraft - Comic Preview</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eeeeee;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            text-align: center;
            font-size: 40px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            font-size: 18px;
        }

        .character {
            text-align: center;
            font-size: 22px;
            margin: 25px;
        }

        .panel {
            background: white;
            margin: 30px 0;
            padding: 20px;
            border: 4px solid #222;
            border-radius: 15px;
            box-shadow: 0 4px 10px #999;
        }

        .panel-title {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .panel-image {
            display: block;
            width: 100%;
            max-width: 900px;
            margin: 10px auto 20px auto;
            border: 3px solid #222;
        }

        .panel-content {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 17px;
        }

        .button {
            display: block;
            width: fit-content;
            margin: 35px auto;
            padding: 14px 28px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 17px;
        }

        .button:hover {
            background: #444;
        }

        .download {
            background: #1877f2;
            font-weight: bold;
        }

        .download:hover {
            background: #0d5dcc;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎨 ComicCraft</h1>

    <p class="subtitle">
        AI Comic Story Creator
    </p>

    <div class="character">
        <strong>Character:</strong> {{ character_name }}
    </div>

    {% for panel in panels %}

    <div class="panel">

        <div class="panel-title">
            🖼️ Panel {{ loop.index }}
        </div>

        {% if images[loop.index0] %}
        <img
            class="panel-image"
            src="{{ images[loop.index0] }}"
            alt="Comic Panel {{ loop.index }}"
        >
        {% endif %}

        <div class="panel-content">
{{ panel }}
        </div>

    </div>

    {% endfor %}

    <a class="button download" href="/download-pdf">
        📄 Download Comic PDF
    </a>

    <a class="button" href="/">
        ← Create Another Comic
    </a>

</div>

</body>
</html>
